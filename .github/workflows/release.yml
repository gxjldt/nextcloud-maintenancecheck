name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # 公司 tag 形如 v2026.11.7.1501（见 AGENTS.md）。上游 v1.x 形状的 tag 到这里直接失败，
      # 防止误推上游 tag 时把 app 版本注入成 1.x。
      - name: Validate tag format
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+\.[0-9]{3,4}$ ]] || { echo "expected vYYYY.M.D.HMM, got $GITHUB_REF_NAME"; exit 1; }'

      - name: Inject app version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s|<version>[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?</version>|<version>${VERSION}</version>|" appinfo/info.xml
          echo "app version -> ${VERSION}"
          grep -n '<version>' appinfo/info.xml

      - name: L10n gates
        run: |
          php scripts/check-l10n-parity.php
          php scripts/regenerate-l10n-js.php
          git diff --exit-code -- l10n

      - name: Install production deps
        run: composer install --no-dev --no-interaction --prefer-dist

      # 打包口径与上游 1.3.1 tarball 一致：排除 tests/e2e/scripts/.github/.git/build，
      # 其余全带（含 vendor，Nextcloud 应用必须自带 composer 依赖）
      - name: Pack
        run: |
          mkdir -p build/release /tmp/stage/maintenancecheck
          cp -a appinfo lib templates css js l10n img data docs screenshots \
                composer.json composer.lock package.json package-lock.json \
                phpunit.xml playwright.config.js infection.json5 \
                CHANGELOG.md LICENSE README.md SECURITY.md .gitignore \
                /tmp/stage/maintenancecheck/
          tar -czf "build/release/maintenancecheck-${GITHUB_REF_NAME}.tar.gz" -C /tmp/stage maintenancecheck
          tar -tzf "build/release/maintenancecheck-${GITHUB_REF_NAME}.tar.gz" | head -3
          test "$(tar -tzf build/release/maintenancecheck-${GITHUB_REF_NAME}.tar.gz | grep -c '^maintenancecheck/vendor/')" -gt 100
          test "$(tar -tzf build/release/maintenancecheck-${GITHUB_REF_NAME}.tar.gz | grep -c '^maintenancecheck/l10n/zh_CN.js')" -eq 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/release/maintenancecheck-${GITHUB_REF_NAME}.tar.gz" \
            --title "MaintenanceCheck $GITHUB_REF_NAME" \
            --generate-notes
